<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- The repository's social preview (GitHub: Settings > General > Social
       preview) and the landing page's og:image.  1280x640, GitHub's size.
       Rendered to brand/social-preview.png by scripts/make-brand.sh. -->
  <rect width="1280" height="640" fill="#002b36"/>

  <!-- The mark (brand/lazyos.svg) at 92 px, and the wordmark. -->
  <g transform="translate(80 150) scale(0.92)">
    <rect x="4" y="4" width="92" height="92" rx="22" fill="#073642"/>
    <polygon points="22,28 56,28 56,40 36,62 56,62 56,72 22,72 22,60 42,38 22,38" fill="#2aa198"/>
    <rect x="62" y="62" width="18" height="10" rx="2" fill="#e8743b"/>
  </g>

  <g font-family="JetBrains Mono">
    <text x="196" y="228" font-size="92" font-weight="800" letter-spacing="-5.5" fill="#eee8d5">lazyOS<tspan fill="#e8743b">_</tspan></text>

    <text x="80" y="310" font-size="28" fill="#d5d0be">Debian for ARM Chromebooks.</text>
    <text x="80" y="350" font-size="28" fill="#d5d0be">Keyboard first. <tspan fill="#2aa198">Lazy by design.</tspan></text>

    <g font-size="17" fill="#2aa198">
      <rect x="80" y="392" width="232" height="40" rx="9" fill="#073642"/>
      <text x="94" y="418">debian forky · arm64</text>
      <rect x="322" y="392" width="89" height="40" rx="9" fill="#073642"/>
      <text x="336" y="418">swayfx</text>
      <rect x="421" y="392" width="69" height="40" rx="9" fill="#073642"/>
      <text x="435" y="418">rofi</text>
      <rect x="500" y="392" width="212" height="40" rx="9" fill="#073642"/>
      <text x="514" y="418">built-in AI agents</text>
    </g>

    <!-- A terminal that says what the name promises. -->
    <rect x="860" y="186" width="340" height="236" rx="16" fill="#073642"/>
    <circle cx="890" cy="214" r="5.5" fill="#1e4a55"/>
    <circle cx="908" cy="214" r="5.5" fill="#1e4a55"/>
    <circle cx="926" cy="214" r="5.5" fill="#1e4a55"/>
    <g font-size="16">
      <text x="884" y="262" fill="#eee8d5"><tspan fill="#93a1a1">$</tspan> lazyos --do-the-boring-part</text>
      <text x="884" y="300" fill="#2aa198">✓ done.</text>
      <text x="884" y="338" fill="#93a1a1">go outside.</text>
      <text x="884" y="376" fill="#93a1a1">$</text>
    </g>
    <rect x="904" y="362" width="10" height="18" fill="#e8743b"/>

    <text x="80" y="600" font-size="15" fill="#93a1a1">github.com/Brunux/LazyOS</text>
  </g>
</svg>
