<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1366" height="912" viewBox="0 0 1366 912">
  <!-- The default lazyOS wallpaper, at the panel's own mode (1366x912,
       docs/optimization.md).  A keyboard in the dark: six staggered rows of
       blank base02 keys running off the right edge, fading into base03 on the
       left, and one lit key in the Z position that carries the mark - the key
       the brand asks you to press.  The wordmark, the tagline and the arcade
       line sit bottom left.

       Rendered by scripts/make-brand.sh with rsvg-convert; the text needs
       JetBrains Mono (fonts-jetbrains-mono), which make-brand.sh checks for.
       brand/README.md has the palette and the rules. -->
  <defs>
    <g id="key">
      <rect y="8" width="84" height="84" rx="16" fill="#001e26"/>
      <rect x="0.5" y="0.5" width="83" height="83" rx="16" fill="#04313d" stroke="#0e4250"/>
    </g>
    <g id="row">
      <use xlink:href="#key" x="0"/>
      <use xlink:href="#key" x="100"/>
      <use xlink:href="#key" x="200"/>
      <use xlink:href="#key" x="300"/>
      <use xlink:href="#key" x="400"/>
      <use xlink:href="#key" x="500"/>
      <use xlink:href="#key" x="600"/>
      <use xlink:href="#key" x="700"/>
      <use xlink:href="#key" x="800"/>
      <use xlink:href="#key" x="900"/>
    </g>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#002b36" stop-opacity="1"/>
      <stop offset="0.34" stop-color="#002b36" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#002b36" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1366" height="912" fill="#002b36"/>

  <!-- The keyboard: rows offset like a real one. -->
  <use xlink:href="#row" x="470" y="120"/>
  <use xlink:href="#row" x="520" y="220"/>
  <use xlink:href="#row" x="544" y="320"/>
  <use xlink:href="#row" x="580" y="420"/>
  <use xlink:href="#row" x="470" y="520"/>
  <use xlink:href="#row" x="510" y="620"/>

  <!-- The lit key, over the blank one in the Z position. -->
  <circle cx="922" cy="466" r="64" fill="#2aa198" opacity="0.4" filter="url(#glow)"/>
  <rect x="880" y="428" width="84" height="84" rx="16" fill="#001e26"/>
  <rect x="881" y="421" width="82" height="82" rx="15" fill="#073642" stroke="#2aa198" stroke-width="2"/>
  <g transform="translate(894 434) scale(0.56)">
    <polygon points="14,22 56,22 56,36 32,64 56,64 56,78 14,78 14,64 38,36 14,36" fill="#2aa198"/>
    <rect x="62" y="66" width="24" height="12" rx="2" fill="#e8743b"/>
  </g>

  <rect width="1366" height="912" fill="url(#fade)"/>

  <!-- All the type is outlined: glyph paths, not <text>.  As text, any
       renderer without the fonts (a file preview, a browser, GitHub) set it
       in a fallback face of another width, and the arcade line, which mixes
       two faces, came apart around "play".  Outlines draw the same
       everywhere, and the build host needs no font for this file.

         lazyOS_            JetBrains Mono ExtraBold 72 px, letter-spacing -3.6,
                            base2, from x=88 on baseline 722; "_" in cursor
                            orange at x=325.6
         lazy by design     JetBrains Mono Regular 20 px, cyan, x=88, baseline 766
         » press any key to JetBrains Mono Regular 15 px, base1, x=88, baseline 800
         play               Silkscreen Bold 20 px, cursor orange, x=261 (one
                            space plus 2 px after "to")
         «                  as the line, x=340

       To change a line, re-outline it from that font at that size and
       position (fontTools' SVGPathPen through a TransformPen). -->
