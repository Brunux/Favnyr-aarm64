# yt-dlp: use the system Node as its JavaScript runtime.
#
# yt-dlp 2026 needs a JS runtime to solve YouTube's JS challenges ("EJS"); only
# deno is enabled by default and Debian ships no deno, so out of the box YouTube
# extraction logs
#   [debug] JS runtimes: none
#   WARNING: No supported JavaScript runtime could be found ... some formats may
#            be missing
# and downloads can come back incomplete. packages/tools.list already installs
# nodejs (Deboma installs it for the agent CLIs, and this port keeps it for npm),
# so the runtime only has to be named.
#
# Read from /etc/yt-dlp.conf, which is where yt-dlp looks for system-wide
# options. Syntax check with `yt-dlp -v --simulate <url>`, whose debug line
# changes from "JS runtimes: none" to "JS runtimes: node".
#
# (The file lives in the UI overlay because that is the only etc/ tree the build
# stages; it configures a tool from packages/tools.list, not the session.)
--js-runtimes node
