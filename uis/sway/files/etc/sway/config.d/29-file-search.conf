# The terminal file search (Alt+Search, ~/.config/bin/lazyos-find) runs fzf in
# foot with this app-id, so it can be floated and centred instead of tiled: the
# window is a menu, and a tiled one would either be the whole panel or squeeze
# the preview pane. 1200x760 on the 1920x1200 panel keeps the list and its
# preview in the proportions fzf is configured for and still leaves the bar and
# the wallpaper around it.
for_window [app_id="lazyos-find"] floating enable
for_window [app_id="lazyos-find"] resize set 1200 760
for_window [app_id="lazyos-find"] move position center
