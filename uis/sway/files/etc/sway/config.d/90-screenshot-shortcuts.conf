# Screenshots and capture: grimshot (a package of its own), and the capture menu
# that also reads the screen and records it (Omarchy: Super+Ctrl+C opens its
# capture menu; Super+Shift+S and Print take a screenshot)

# The capture menu: screenshot (screen, area, window), annotate, OCR, QR, record
bindsym $mod+Ctrl+c exec /home/brunux/.config/bin/rofi-capture

# Save a screenshot of the whole screen
# -n is grimshot's notification: the picture is announced with the file it was
# saved to, and a copy says it is on the clipboard.  Without it the key is
# silent, which reads as "the shortcut does not work".
bindsym $mod+Shift+f exec grimshot -n save screen

# Select an area and save it
bindsym $mod+Shift+s exec grimshot -n save area

# Select an area and copy it
bindsym $mod+Ctrl+s exec grimshot -n copy area
