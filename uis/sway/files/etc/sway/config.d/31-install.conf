# The install log (rofi-install's "Show the install log" row, ~/.config/bin/
# lazyos-install-log) opens less in foot with this app-id, so it can be floated
# and centred instead of tiled: it is a window to read, and a tiled one would
# take the whole panel while a person compares it with the notification that
# sent them here. 1200x760 is the box the file search uses, and for the same
# reason: the panel is 1920x1200 and the content is long lines of shell output.
for_window [app_id="lazyos-install"] floating enable
for_window [app_id="lazyos-install"] resize set 1200 760
for_window [app_id="lazyos-install"] move position center
