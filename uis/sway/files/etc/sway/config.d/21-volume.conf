# Volume control: pactl talks to PipeWire's PulseAudio server, and the keys act
# on whatever sink is default (the UCM boot sequence in alsa-utils is what gives
# the MT8192 card a real sink instead of a Dummy Output).
#
# The keys go through ~/.config/bin/osd: it runs the same pactl command and then
# shows the level as a mako card with a progress bar, because the bar's own
# number is covered by a fullscreen window - which is exactly when a key with no
# visible effect reads as a broken key.

# Volume up 5%
bindsym --locked XF86AudioRaiseVolume exec /home/brunux/.config/bin/osd volume up

# Volume down 5%
bindsym --locked XF86AudioLowerVolume exec /home/brunux/.config/bin/osd volume down

# Mute (Shift+Mute switches the audio output, see 24-keys.conf)
bindsym --locked XF86AudioMute exec /home/brunux/.config/bin/osd volume mute
