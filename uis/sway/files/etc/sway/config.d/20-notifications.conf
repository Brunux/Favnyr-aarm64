# Notifications: mako, once per session. It reads ~/.config/mako/config (the
# solarized theme) and owns org.freedesktop.Notifications on the session bus;
# when it is not running, applications' notifications disappear without a log
# line, which is why check-system.sh asks the bus.
#
# The package is mako-notifier (the binary is /usr/bin/mako).
exec mako
