# Clipboard history: the one resident process this session has.
#
# `cliphist` keeps the history; the watcher that feeds it is wl-clipboard's own
# `wl-paste --watch`, which waits on the compositor's selection instead of polling.
# It costs about 2 MB and it is what makes Alt+Ctrl+V possible at all: wl-clipboard
# alone only ever knows the current selection.
#
# It stores everything copied, including anything secret that passes through the
# clipboard, in ~/.cache/cliphist/db.  Alt+Ctrl+V offers "Clear the history", and
# the database is a file anyone with the account can delete.
#
# `exec` (not `exec_always`): one watcher per session, restarted with the session.
exec wl-paste --watch cliphist store
