# Backlight down 5% (the udev rule in etc/udev/rules.d/90-brightnessctl.rules
# makes the backlight writable by the session user).

# Backlight down 5%
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-

# Backlight up 5%
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+
