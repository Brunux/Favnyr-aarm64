# Backlight down 5% (the udev rule in etc/udev/rules.d/90-brightnessctl.rules
# makes the backlight writable by the session user).
#
# The keys go through ~/.config/bin/osd, which does the step and draws the level
# as a mako card: the bar's 12 px number is behind whatever window is focused,
# and a fullscreen video covers the bar entirely.  One helper for both this pair
# and the volume keys below, so the overlay has one look and one tag.

# Backlight down 5%
bindsym --locked XF86MonBrightnessDown exec /home/brunux/.config/bin/osd brightness down

# Backlight up 5%
bindsym --locked XF86MonBrightnessUp exec /home/brunux/.config/bin/osd brightness up
