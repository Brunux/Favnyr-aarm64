# The bar's detailed views: nmtui, bluetoothctl and the apt updater open in
# alacritty with `--class popup` (see the on-click-right entries in
# ~/.config/waybar/config.jsonc). Alacritty maps that to the Wayland app_id,
# so they can be floated, centred and sized here instead of tiling like a
# terminal. 940x620 fills the 1920x1200 panel without covering the bar.
for_window [app_id="popup"] floating enable
for_window [app_id="popup"] resize set 940 620
for_window [app_id="popup"] move position center

# Same rule for an X11 client that ever uses the class (alacritty is Wayland
# here, but the class is also what `alacritty --class popup` sets for Xwayland).
for_window [class="popup"] floating enable
for_window [class="popup"] resize set 940 620
for_window [class="popup"] move position center
