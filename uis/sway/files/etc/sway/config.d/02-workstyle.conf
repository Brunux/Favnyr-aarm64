# Workspace icons: workstyle (tools/workstyle/) renames each workspace to
# "<number>: <icons>", one glyph per kind of window in it, and the bar's pill
# draws that name. It reads ~/.config/workstyle/config.toml on every workspace
# or window event, so an edit lands on the next switch and needs no restart.
#
# `exec_always` because a reload is also the way to bring it back if it died;
# the lockfile in $XDG_RUNTIME_DIR is what keeps that from starting a second
# copy (the extra one exits 0 at debug level, see tools/workstyle/patches/).
#
# Workspaces must be addressed by number - `workspace number 3`, never
# `workspace 3` - because the names change as windows come and go: the name is
# "3: <icons>", and the bindings in etc/sway/config and every drop-in already
# use `number`. check-system.sh FAILs on a binding that does not.
exec_always --no-startup-id workstyle
