# Tablet mode: the keyboard folded back.
#
# cros_ec_buttons reports SW_TABLET_MODE (SW=3: lid + tablet), so sway answers
# with these two switches and nothing has to be written for the hardware.  The
# script brings the on-screen keyboard up, turns the touchpad *and* the physical
# keyboard off (folded keys are on the table, and they type), and starts the
# 1 Hz accelerometer poller that turns the screen with the device; the reverse
# puts all of them back.  The keyboard is only switched off once the on-screen
# one is confirmed running, so a failed start cannot leave the machine with the
# touchscreen as its only input.
#
# Detach the keyboard -> keyboard up, both physical inputs off, screen follows.
# Reattach           -> keyboard gone, both inputs back, screen upright.
#
# The switch is read from cros_ec_buttons, which is a switch device and not one
# of the keyboards turned off, so reattaching still delivers `tablet:off` - and
# logind reads the same node for the Lock key, so suspending by the key keeps
# working in tablet mode.
#
# `tablet-mode` is also in Settings, for a keyboard that is already detached,
# together with "Calibrate rotation" for a screen that turns the wrong way (the
# accelerometer's idea of up differs between panels; the calibration is stored
# in ~/.config/lazyos/tablet.conf and needs no rebuild).
bindswitch tablet:on exec /home/brunux/.config/bin/tablet-mode on
bindswitch tablet:off exec /home/brunux/.config/bin/tablet-mode off
