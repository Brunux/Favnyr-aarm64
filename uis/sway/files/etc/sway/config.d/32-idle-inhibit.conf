# What must not be interrupted by the idle chain.
#
# The idle screen at 150 s and the lock at 300 s count input, not playback, so a
# film in a tab or a presentation was interrupted in the middle. mpv needs
# nothing here: --stop-screensaver defaults to yes and the binary carries
# zwp_idle_inhibitor_v1, so it asks the compositor itself. Firefox and papers
# ask the *portal* instead (org.freedesktop.portal.Inhibit), and this image runs
# no portal backend for it, so the compositor holds the inhibitor on their
# behalf - one line per application, no process, no package.
#
# `fullscreen` is the right scope for both: a browser or a reader merely open
# must not keep the machine awake all day, while a fullscreen video or a
# presentation is exactly the case the timer must yield to.  The rules are
# verified against swayidle: a window with an active inhibitor keeps a 2 s
# timeout from firing.
#
# mpv is matched too, for the case where its own inhibitor is disabled in a
# profile (the player starts with --no-config in this session, so it is not).
for_window [app_id="(?i)^firefox"] inhibit_idle fullscreen
for_window [app_id="org.gnome.Papers"] inhibit_idle fullscreen
# A video in mpv is watched in its own window, not necessarily fullscreen; while
# the window is visible the screen should stay on. mpv's own inhibitor already
# does this, and the rule makes it independent of the player's configuration.
for_window [app_id="mpv"] inhibit_idle visible
