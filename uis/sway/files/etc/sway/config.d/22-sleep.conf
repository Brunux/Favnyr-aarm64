# Sleep: two shortcuts, both ending in ~/.config/bin/sway-suspend.
#
# The Chromebook's Lock key needs none of this: keyd does not swallow KEY_SLEEP,
# so logind suspends on the key itself (see 21-lock-screen.conf).  sway-suspend
# tries `loginctl suspend` first, falls back to `sudo -n loginctl suspend` and
# then straight to /sys/power/state, logging every attempt to
# ~/.cache/sway-suspend.log: if the machine does not sleep, that file says why.

# Lock the screen, then sleep (the Nura session's shortcut)
bindsym $mod+Shift+Escape exec sh -c '/home/brunux/.config/bin/sway-lock --wait && exec /home/brunux/.config/bin/sway-suspend'

# Sleep without locking first
bindsym $mod+Ctrl+Escape exec /home/brunux/.config/bin/sway-suspend
