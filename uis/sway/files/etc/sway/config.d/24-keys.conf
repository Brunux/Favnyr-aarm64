# Launcher views, panels and the keys Omarchy puts on Super
#
# This session's modifier is Alt where Omarchy uses Super, so the letter and the
# Ctrl/Shift combination are kept wherever sway does not already own them; the
# three exceptions are listed in /usr/share/doc/nureb/03-shortcuts.md
#
# Every binding here has a one-line description above it: rofi-keys (Alt+Shift+K)
# shows those comments, and a description covers the bindings below it until a
# blank line or another comment, so a binding without one appears as its raw
# command

# Every binding, searchable; Enter copies the command (Omarchy: Super+K)
bindsym $mod+Shift+k exec /home/brunux/.config/bin/rofi-keys

# Dictation on and off (Omarchy: Super+Ctrl+X)
bindsym $mod+Ctrl+x exec /home/brunux/.config/bin/dictate

# Coding agents: launch, accounts, install (Omarchy: Super+Shift+Ctrl+A)
bindsym $mod+Ctrl+Shift+a exec /home/brunux/.config/bin/rofi-agents

# The root menu, the bar's menu button on the keyboard (Omarchy: Super+Space)
bindsym $mod+space exec /home/brunux/.config/bin/bar-menu

# Audio output panel: the sinks, plus the two mutes (Omarchy: Super+Ctrl+A)
bindsym $mod+Ctrl+a exec /home/brunux/.config/bin/bar-audio

# Bluetooth panel: scan, then connect or disconnect (Omarchy: Super+Ctrl+B)
bindsym $mod+Ctrl+b exec /home/brunux/.config/bin/bar-bt

# Network panel: Wi-Fi list, strongest first (Omarchy: Super+Ctrl+W)
bindsym $mod+Ctrl+w exec /home/brunux/.config/bin/bar-net

# Power panel: charge, draw, time left and the session actions (Omarchy: Super+Ctrl+P)
bindsym $mod+Ctrl+p exec /home/brunux/.config/bin/bar-power

# Float the focused window (Omarchy: Super+T)
bindsym $mod+t floating toggle

# Close the focused window (Omarchy: Super+Q; its Super+W is sway's tabbed layout here)
bindsym $mod+q kill

# Switch the audio output without the bar (Omarchy: Shift+AudioMute)
bindsym --locked Shift+XF86AudioMute exec /home/brunux/.config/bin/bar-audio

# Scratchpad: show or cycle the hidden window (Omarchy: Super+grave)
bindsym $mod+grave scratchpad show

# Scratchpad: send the focused window there (Omarchy: Super+Shift+grave)
bindsym $mod+Shift+grave move scratchpad

# Alt+minus and Alt+Shift+minus keep working as the sway-default aliases for the
# two scratchpad actions above
