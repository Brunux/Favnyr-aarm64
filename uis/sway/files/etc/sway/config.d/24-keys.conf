# The keys that open the manual views and the two features that need a key of
# their own. Omarchy puts the same actions on Super; this session's modifier is
# Alt, so the letter is kept and the modifier differs (see
# /usr/share/doc/nureb/03-shortcuts.md).
#
#   Alt+Shift+K     every binding, parsed from the configuration (Super+K there)
#   Alt+Ctrl+X      dictation on/off (Super+Ctrl+X there)
#   Alt+Ctrl+Shift+A  coding agents: launch, accounts, install
#                   (Super+Shift+Ctrl+A there)
#   Alt+T           float the focused window (Super+T there)
#   Alt+grave       the root menu, the same list as the bar's menu button
#                   (Super+Space there, which is focus mode in sway)
#   Shift+Mute      switch the audio output (Shift+AudioMute there)
bindsym $mod+Shift+k exec /home/brunux/.config/bin/rofi-keys
bindsym $mod+Ctrl+x exec /home/brunux/.config/bin/dictate
bindsym $mod+Ctrl+Shift+a exec /home/brunux/.config/bin/rofi-agents
bindsym $mod+t floating toggle
bindsym $mod+grave exec /home/brunux/.config/bin/bar-menu
bindsym --locked Shift+XF86AudioMute exec /home/brunux/.config/bin/bar-audio
