# Three-finger swipes on the touchpad. Left and right stay inside the session -
# they switch workspaces, the same action as Alt+Tab (the window switcher) and
# the number row (Alt+1..Alt+0). Up and down belong to the focused *window*:
# they type Ctrl+Tab and Ctrl+Shift+Tab into it, which is how Firefox moves to
# the next / previous tab.
#
# They carry a filter, and it is sway's own: `[app_id=... con_id="__focused__"]`
# is a criteria prefix on the command, so the compositor decides before anything
# is started. `con_id="__focused__"` is the half that matters - without it a
# criteria matches *every* window of that app, focused or not (measured: an
# `[app_id="firefox-esr"] exec ...` ran with a terminal focused), and with it the
# command runs only while the focused window is Firefox. `(?i)^firefox` covers
# `firefox-esr` (what Debian's package reports here) and upstream `firefox`.
#
# The price is what the filter saves: with Firefox focused a swipe costs the
# `wtype` process, and with anything else focused it costs nothing at all - no
# fork, no IPC, one walk of the container tree inside sway. A helper script
# asking `swaymsg -t get_tree | jq` would cost ~12 ms per swipe in every app and
# ~24 ms in Firefox (measured), which is why the check lives in the binding.
#
# sway has no command that sends a key to a client, so those two are `wtype`,
# which drives the virtual keyboard protocol (the same one the emoji picker and
# dictation use): the application receives a real Ctrl+Tab, so it works in a
# browser, an editor and an Xwayland program alike. `-M` presses a modifier and
# holds it for whatever comes next, so each one is released again with `-m`
# (wtype releases on exit anyway; the pair is written out so the chord reads as
# one, the way the emoji picker already does it).
#
# One deliberate limit: the filter is on the Wayland app_id, so a Firefox forced
# onto Xwayland (`MOZ_ENABLE_WAYLAND=0`) has no app_id and gets no gesture. One
# criteria cannot say "app_id or class", and a second bindgesture for the same
# gesture is the duplicate that raises the red config-error bar on reload.

# Three-finger swipe to the left: next workspace
bindgesture swipe:3:left workspace next_on_output

# Three-finger swipe to the right: previous workspace
bindgesture swipe:3:right workspace prev_on_output

# Three-finger swipe up: next tab in Firefox (Ctrl+Tab)
bindgesture swipe:3:up [app_id="(?i)^firefox" con_id="__focused__"] exec wtype -M ctrl -k Tab -m ctrl

# Three-finger swipe down: previous tab in Firefox (Ctrl+Shift+Tab)
bindgesture swipe:3:down [app_id="(?i)^firefox" con_id="__focused__"] exec wtype -M ctrl -M shift -k Tab -m shift -m ctrl
