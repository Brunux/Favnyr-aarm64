# The launcher. $launcher (tofi-drun) is the application list - Deboma's walker
# equivalent, and it launches a .desktop entry with Terminal=true inside foot by
# itself (verified on 0.9.1: the terminal is prepended even with drun-launch=true).
# $runner is the command palette: run-command runs tofi-run, which lists $PATH and
# *prints* its selection (it does not execute it), and starts it in foot - which is
# how the terminal tools from packages/tools.list are reached, since they have no
# .desktop entry.
#
# The theme lives in ~/.config/tofi/config, so these bindings stay one word each.
# tofi exits with the window, so nothing stays resident.
bindsym $mod+d exec $launcher
bindsym $mod+Shift+d exec $runner
