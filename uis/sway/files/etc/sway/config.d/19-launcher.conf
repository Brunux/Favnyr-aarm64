# The launcher. $launcher (tofi-drun) is the application list - Deboma's walker
# equivalent; $runner (tofi-run) is the same box listing every executable in
# $PATH, which is how the tools in packages/tools.list are reached (btop,
# lazygit, ffmpeg and friends have no .desktop entry).
#
# The theme lives in ~/.config/tofi/config, so these bindings stay one word each.
# tofi hands the selection back (drun-launch=true runs it directly); it exits
# with the window, so nothing stays resident.
bindsym $mod+d exec $launcher
bindsym $mod+Shift+d exec $runner
