# The launcher, the command palette and the window switcher: one binary and one
# theme (~/.config/rofi/config.rasi, which loads solarized.rasi).
#
#   $mod+d (and the Search key, bound in ~/.config/sway/config)
#              rofi -show drun    the .desktop entries, including the port's own
#                                 session actions in usr/share/applications/org.nureb.*
#   $mod+Tab   rofi -show window  the window switcher, over wlroots' foreign-toplevel
#                                 protocol; sway has none of its own
#   $mod+Shift+d
#              rofi -show run     every executable in $PATH; Enter runs it, and
#                                 Shift+Enter runs it in foot (the terminal option in
#                                 config.rasi), which is how the TUIs from
#                                 packages/tools.list are started
#
# rofi exits with its window, so nothing stays resident.

# Applications: the .desktop entries, including the port's own session actions
bindsym $mod+d exec $launcher

# Window switcher: the open windows, over wlroots' foreign-toplevel protocol
bindsym $mod+Tab exec $switcher

# Command palette: every executable in $PATH; Shift+Enter runs it in foot
bindsym $mod+Shift+d exec $runner

# The browser (Omarchy has no key for it: its launcher is the way there).  The
# image ships one browser, firefox-esr, and it is also what xdg-open starts and
# what rofi-files opens a non-text file with, so the key is the direct path to
# the same program.
bindsym $mod+Shift+Return exec firefox-esr
