# Solarized Dark theme, ported from Nura.

# Typography
font pango:monospace 10

# Window borders
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart

# The palette is not here. It belongs to the theme engine (spec 004):
# ~/.config/sway/config.d/35-theme.conf is generated from theme.toml and included
# after this file, so a theme switch moves the border colours without editing a
# root-owned file.

# Comfortable spacing without wasting screen space
gaps inner 8
gaps outer 4
