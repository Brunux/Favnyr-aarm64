# Locking, and the power menu.
#
# Omarchy keeps lock on Super+Ctrl+L and the system menu on Super+Escape; the
# same keys are used here with Alt as the modifier. The Lock key needs no
# shortcut at all (see below).

# Lock the screen (Omarchy: Super+Ctrl+L)
bindsym $mod+Ctrl+l exec /home/brunux/.config/bin/sway-lock

# The power menu: lock, suspend, hibernate, log out, reboot, shut down
# (Omarchy's Super+Escape).  This used to run bar-power, the *battery* panel
# behind the bar's indicator, which answers a different question; a banner of
# numbers under a key documented as a menu of actions read as "does not work".
bindsym $mod+Escape exec /home/brunux/.config/bin/rofi-power

# The Lock key (right-most key of the top row) emits KEY_SLEEP, and keyd leaves
# that key alone on purpose (see etc/keyd/default.conf), so systemd-logind
# suspends the machine on the key itself: no polkit, no session lookup, no
# shortcut involved.  The binding only locks the screen -- logind reaches the
# kernel about 0.3 s later, which is enough for swaylock to have drawn.

# Lock the screen when the Lock key is pressed (logind suspends a moment later)
bindsym XF86Sleep exec /home/brunux/.config/bin/sway-lock

# If the Lock key is ever remapped to KEY_COFFEE (Nura's `sleep = coffee`), it
# arrives as XF86ScreenSaver and logind never sees a suspend key; the session
# then has to drive the suspend itself through the sway-suspend helper.

# Lock, then suspend, for a keymap that sends KEY_COFFEE
bindsym XF86ScreenSaver exec sh -c '/home/brunux/.config/bin/sway-lock --wait && exec /home/brunux/.config/bin/sway-suspend'
