# Lock with the window-manager modifier (Alt), or with the Chromebook's Lock key.
# The right-most key of the top row emits KEY_SLEEP; keyd maps `sleep = coffee`, and
# KEY_COFFEE is the XF86ScreenSaver keysym in xkb (see AGENTS.md).
bindsym $mod+Escape exec swaylock -c 002b36

# The Lock key locks *and* sleeps, the way the Alt+Shift+Escape shortcut in
# 22-sleep.conf does (that shortcut is how the Nura session sleeps: there the Lock
# key is inert).  Lock first so the screen is already locked when the machine
# suspends.  loginctl suspend goes through systemd-logind and needs polkitd to
# allow the active session to suspend, which Debian's stock login1 policy does.
bindsym XF86ScreenSaver exec sh -c 'swaylock -f -c 002b36; sleep 1; loginctl suspend'
