# The idle screensaver and the idle lock.
#
# Deboma's shell runs the screensaver 150 s after the last input and the lock at
# 300 s (its shell.json: "idle": {"screensaver": 150, "lock": 300}). The
# screensaver there is a Quickshell-rendered loop; here it is
# ~/.config/bin/sway-screensaver, a fullscreen foot window that plays the logo
# animation once and keeps the last frame (see the script for what that costs).
#
# Two things are deliberate:
#   * the lock kills the screensaver first, so unlocking does not land back on a
#     logo the user has to dismiss;
#   * any key dismisses the screensaver, and swaylock then gets the next one.
# The Lock key needs none of this (see 21-lock-screen.conf): logind suspends on
# KEY_SLEEP and the binding locks at the same moment.
for_window [app_id="org.nureb.screensaver"] border none
for_window [app_id="org.nureb.screensaver"] fullscreen enable

# `-w` keeps the timers honest around a resume: without it swayidle restarts
# them after the machine wakes and the screensaver fires again immediately.
exec swayidle -w \
	timeout 150 '/home/brunux/.config/bin/sway-screensaver' \
	timeout 300 'pkill -f org.nureb.screensaver; swaylock -f -c 002b36' \
	before-sleep 'swaylock -f -c 002b36' \
	after-resume 'pkill -f org.nureb.screensaver'
