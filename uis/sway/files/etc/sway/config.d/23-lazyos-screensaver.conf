# The idle screen and the idle lock.
#
# Deboma's shell runs the screensaver 150 s after the last input and the lock at
# 300 s (its shell.json: "idle": {"screensaver": 150, "lock": 300}).  The same
# chain runs here on swayidle:
#
#   150 s  ~/.config/bin/lazyos-screensaver   the LazyOS wordmark, looping
#   300 s  ~/.config/bin/sway-lock            the lock, which stops the saver
#
# The saver is a fullscreen foot window (app id org.lazyos.screensaver) and the
# only surface that carries the LazyOS name; the rest of the distribution still
# calls itself Nureb.  It refuses to start while swaylock is up, so a lock that
# arrives between the two timers cannot leave an invisible animation running
# underneath it, and any key ends it - the next idle period starts over.
#
# What the loop costs is measured in docs/optimization.md: 30 fps with a reused
# canvas, not Deboma's 120 fps terminal loop.
for_window [app_id="org.lazyos.screensaver"] border none
for_window [app_id="org.lazyos.screensaver"] fullscreen enable

# `-w` keeps the timers honest around a resume: without it swayidle restarts
# them after the machine wakes and the screensaver fires again immediately.
# `before-sleep` returns as soon as swaylock reports the screen covered (bounded,
# see sway-lock), which is inside logind's 5 s inhibitor budget.
exec swayidle -w \
	timeout 150 '/home/brunux/.config/bin/lazyos-screensaver' \
	timeout 300 '/home/brunux/.config/bin/sway-lock' \
	before-sleep '/home/brunux/.config/bin/sway-lock --wait' \
	after-resume 'pkill -f org.lazyos.screensaver'
