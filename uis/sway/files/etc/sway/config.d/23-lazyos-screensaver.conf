# The idle screen and the idle lock.
#
# Deboma's shell runs the screensaver 150 s after the last input and the lock at
# 300 s (its shell.json: "idle": {"screensaver": 150, "lock": 300}).  The same
# chain runs here on swayidle:
#
#   150 s  ~/.config/bin/lazyos-screensaver   the LazyOS wordmark, looping
#   300 s  ~/.config/bin/sway-lock            the lock, which stops the saver
#   360 s  swaymsg "output * power off"       the panel itself, DPMS off
#
# The last one is not decoration: the lock covers the screen but the backlight
# stays on, so an idle machine at 300 s still lit the room and still spent the
# panel's power.  `output * power off` is wlroots' DPMS equivalent (the `dpms`
# command is deprecated) and `resume` puts it back on the first input, so the
# wake needs no key press of its own - swayidle runs the resume line when input
# returns, and the monitor answers without the compositor having to be told a
# second time.
#
# `after-resume` also restores the external display, and that cannot be done
# from udev: the ANX7625 powers down with the display pipeline, re-initialises
# on the way back and resets its Type-C crosspoint to the power-on default (the
# left port), while the EC re-detects the partner without re-adding the alt-mode
# device the udev rule matches.  The DP connector stays "connected" with its
# EDID and sway keeps the mode, so the picture goes to the empty port until the
# cable is replugged.  lazyos-dp-resume writes the crosspoint and forces one
# modeset (a 720p round trip, which leaves the workspace layout alone, unlike
# disabling the output), which retrains the link.
#
# The saver is a fullscreen foot window (app id org.lazyos.screensaver) and the
# only surface that carries the block wordmark; the launcher icon and the
# wordmark come from scripts/make-brand.sh.  It refuses to start while swaylock
# is up, so a lock that arrives between the two timers cannot leave an invisible
# animation running underneath it, and any key or any mouse movement ends it -
# the pointer is read through the terminal's own mouse reporting (DECSET 1003),
# which is the only way a pty hears it - the next idle period starts over.
#
# What the loop costs is measured in docs/optimization.md: 30 fps with a reused
# canvas, not Deboma's 120 fps terminal loop.
for_window [app_id="org.lazyos.screensaver"] border none
for_window [app_id="org.lazyos.screensaver"] fullscreen enable

# `-w` is load-bearing for sleep, and it is also why the 150 s command must
# return at once.  swayidle holds a logind delay inhibitor for the session and
# releases it in prepare_for_sleep *after* the before-sleep command returns -
# without `-w` the release happens as soon as the command is forked, so the
# machine would sleep while swaylock was still drawing (the desktop visible on
# the way down, which is the bug sway-lock's readiness handshake was built for).
# The price is that `-w` waits for *every* command in the chain, in the event
# loop itself (main.c, cmd_exec: waitpid): a 150 s command that stayed in the
# foreground would hold the 300 s lock, the 360 s DPMS, the resume lines and
# before-sleep for as long as it ran, so the session would never lock while the
# wordmark was up.  lazyos-screensaver therefore starts its window and exits,
# and that is measured, not assumed: with `-w` a `timeout 1 'sleep 100'` kept a
# 2 s timeout from firing within 5 s; without `-w` it fired at 2 s.
#
# `before-sleep` returns as soon as swaylock reports the screen covered (bounded,
# see sway-lock), which is inside logind's 5 s inhibitor budget.  `after-resume`
# also restarts the night light: the panel comes back with its own gamma table,
# so wlsunset has to ask for the warm one again or the screen wakes up at
# daylight colour while the Settings switch still says on.  The night light does
# nothing when it was off before the sleep.  The saver is matched with a
# bracketed pattern (`[o]rg...`) so `pkill` does not match the shell running this
# chain: that shell's own command line carries the pattern, and an unbracketed
# one would kill it before the restart.  `after-resume` turns the panel back on
# too: a suspend/resume cycle is a resume, not an idle timeout, so the `resume`
# line below never ran.
exec swayidle -w \
	timeout 150 '/home/brunux/.config/bin/lazyos-screensaver' \
	timeout 300 '/home/brunux/.config/bin/sway-lock' \
	timeout 360 'swaymsg "output * power off"' \
	resume 'swaymsg "output * power on"' \
	before-sleep '/home/brunux/.config/bin/sway-lock --wait' \
	after-resume 'pkill -f "[o]rg.lazyos.screensaver"; swaymsg "output * power on"; /home/brunux/.config/bin/night-light resume; /home/brunux/.config/bin/lazyos-dp-resume'
