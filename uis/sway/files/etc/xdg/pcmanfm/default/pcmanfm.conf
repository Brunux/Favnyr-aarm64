# pcmanfm's system-wide settings (/etc/xdg/pcmanfm/default/pcmanfm.conf).
#
# The package ships its own copy of this file; the overlay replaces it so that
# the file manager this image installs behaves like the rest of the session
# instead of like a 2021 LXDE default. libfm reads the system file first and a
# user's ~/.config/pcmanfm/default/pcmanfm.conf after it, so every key here is
# something the user can still change in Preferences.
#
# `terminal` lives under [config] because that is where libfm reads it
# (src/base/fm-config.c, fm_config_load_from_key_file), not under [ui] where it
# looks like it belongs - the directory to look at in a key file is the section
# of the loader, not the one the Preferences dialog suggests.

[config]
# 0 = ask GIO for the default application, which is how /etc/xdg/mimeapps.list
# and lazyos-view are reached. 1 would exec the file itself.
bm_open_method=0
# "Open Terminal Here" and F4. foot is the session terminal (packages.list).
terminal=foot
# Trash: gvfs provides gvfsd-trash, so a deleted file lands in ~/.local/share/
# Trash and can be restored, instead of being unlinked on the spot.
use_trash=1
confirm_trash=1
# ISO dates in the list view, and no forced SI units: the rest of the session
# prints 2026-10-21 and binary sizes.
date_iso_8601=1
si_unit=0
# Thumbnails are decoded by libfm itself, on the UI thread, with gdk-pixbuf -
# there is no separate decoder process to gate. So bound what it will touch: a
# file over 4 MB shows its mimetype icon instead of a decode, because a 24 MP
# JPEG costs ~83 MB of RSS for its 128 px thumbnail (measured, optimization.md
# §7) and this is a 4 GB device. libfm measures this key in KB.
thumbnail_max=4096

[ui]
# 128 px matches ~/.cache/thumbnails/normal (what lazyos-thumbnail writes and
# rofi draws at 32 px); anything larger is decoded, shrunk and thrown away.
show_thumbnail=1
thumbnail_size=128
# A window that fits 1280x800 with the bar: 900x600, sidebar on the left.
win_width=900
win_height=600
splitter_pos=160
side_pane_mode=1
# 0 = icon view, 0 = name ascending, 2 = folders first (the order rofi-files
# uses), and tabs wide enough for a filename.
view_mode=0
sort_type=0
sort_by=2
max_tab_chars=32
show_hidden=0

[volume]
# Autorun is off, always: executing a file because a card was inserted is the one
# setting that turns removable media into code. Mounting is left to udisks2
# through gvfs' volume monitor - when the image ships udisks2 (uis/sway/
# packages.list does; udiskie, the resident tray daemon, does not) a stick
# appears in the sidebar already mounted, which is what an unprivileged session
# cannot do by itself. Without udisks2 both keys are inert and the sidebar simply
# has no devices, so nothing here is a hard dependency.
mount_on_startup=0
mount_removable=1
autorun=0

[places]
# Network places off: they need gvfs-backends (samba-libs, 31 MB), which this
# image does not install. Home, root, the applications, the trash and the
# bookmarks stay, and so does the computer entry (the root filesystem and any
# device udisks2 hands over). Unmounted internal partitions stay hidden: the
# kernel partition and the boot partition are 128 MB and 512 MB of noise in a
# file manager.
places_network=0
places_computer=1
places_unmounted=0

[desktop]
# pcmanfm's desktop mode (icons on the X11 root window) is X11-only: on sway
# nothing starts it, and `pcmanfm --desktop` exits. Kept at the package defaults.
wallpaper_mode=0
show_wm_menu=0
