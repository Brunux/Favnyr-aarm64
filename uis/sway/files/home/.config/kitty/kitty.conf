# kitty: the optional second terminal, in the session's solarized palette.
#
# The session's terminal is foot (foot.ini), and it stays that way: foot is what
# `set $term` in /etc/sway/config starts, what the bar's popups run
# (`--app-id=popup`) and what every menu that needs a terminal opens.  This file
# exists because a terminal installed by hand should not arrive with a *different*
# theme: a kitty on its default palette beside a solarized foot is two themes on
# one wallpaper, and the one that looks wrong is the one nobody configured.
#
# Every line below is the decision foot.ini already makes, so the two terminals
# are the same terminal to look at: solarized dark, JetBrains Mono 11 with the
# Nerd Font fallback, 6 px of padding, 0.87 alpha with the compositor's blur
# behind it, 1000 lines of scrollback, no audio bell.
#
# Syntax check: kitty 0.48 has no `--debug-config` (it was removed), so the check
# is kitty's own parser with no window: `kitty +runpy` loading this file through
# `kitty.config.load_config`, which is what check-system.sh runs.  An unknown key
# only reaches stderr ("Ignoring unknown config key") and a value that does not
# parse is dropped in favour of the default, so neither shows up as an error
# anywhere a person would look.

# ---------------------------------------------------------------------------
# Font
# ---------------------------------------------------------------------------
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

# kitty falls back through fontconfig on its own, but a Nerd Font glyph has to
# come from the *Mono* variant: the plain one is drawn two cells wide and every
# row that carries an icon - eza --icons, fastfetch, starship's git glyphs -
# stops lining up.  The ranges are the private use area only (E000-F8FF is where
# Font Awesome, codicons, devicons, Seti and Powerline live; F0000-FFFFD is Nerd
# Fonts' Material Design plane), so no text codepoint can be captured by this
# mapping.
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono
symbol_map U+F0000-U+FFFFD Symbols Nerd Font Mono

# JetBrains Mono's programming ligatures are drawn, which is kitty's default.
# foot cannot draw them, so this is the one respect in which the two terminals
# render the same command differently - nothing that changes a byte of output,
# and the narrower of the two windows is the one that chose the font.

# ---------------------------------------------------------------------------
# Colours: solarized dark, the same 16 values as foot.ini
# ---------------------------------------------------------------------------
foreground           #93a1a1
background           #002b36
selection_foreground #93a1a1
selection_background #073642
cursor               #93a1a1
cursor_text_color    #002b36
url_color            #2aa198

color0  #073642
color1  #dc322f
color2  #859900
color3  #b58900
color4  #268bd2
color5  #d33682
color6  #2aa198
color7  #eee8d5
color8  #586e75
color9  #cb4b16
color10 #586e75
color11 #657b83
color12 #839496
color13 #93a1a1
color14 #657b83
color15 #fdf6e3

# ---------------------------------------------------------------------------
# Window
# ---------------------------------------------------------------------------
# swayfx is the frame: the focused window gets a 2 px border in cyan
# (client.focused in config.d/90-solarized.conf) and the session has no title bars
# anywhere - foot asks for the compositor's decoration with [csd]
# preferred=server, and swayfx advertises org_kde_kwin_server_decoration_manager.
# Without this line kitty paints its own decoration on top of that border.
hide_window_decorations yes
window_padding_width    6

# 0.87 is foot's number.  The blur is swayfx's, drawn *behind* a surface whose
# alpha is below 1 (config.d/26-swayfx.conf), so the terminal only has to be
# translucent.  background_blur stays at 0 on purpose: kitty draws blur only when
# the compositor speaks org_kde_kwin_blur or ext_background_effect_v1, and swayfx
# advertises neither (checked with WAYLAND_DEBUG=1: the registry lists
# wl_compositor, xdg_wm_base, the KDE decoration manager and nothing about blur),
# so setting it would be a line that does nothing while reading as if the effect
# were configured here.
background_opacity 0.87
dynamic_background_opacity yes

# One window has no tab bar; the day there are two, they are solarized too.
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
active_tab_background   #073642
active_tab_foreground   #eee8d5
inactive_tab_background #002b36
inactive_tab_foreground #586e75
tab_bar_background      #002b36

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------
scrollback_lines 1000
enable_audio_bell no

# sway sees every Alt chord before the window does, so kitty's own shortcuts stay
# on ctrl+shift (its default kitty_mod) instead of fighting the session for Alt:
# ctrl+shift+c/v copy and paste, ctrl+shift+t is a new tab, and ctrl+shift+z/x
# jump between shell prompts (kitty's defaults, which the manual's table repeats -
# the obvious ctrl+shift+left/right are *window* keys, not prompt keys).

# Alt+Q is sway's `kill` and it sends a close request; it cannot answer a dialog,
# so a confirmation here would leave a window that the session's own key cannot
# close.  A runaway command is stopped with ctrl+c, not by refusing to close.
confirm_os_window_close 0

# The terminal is an apt package that userspace updates; a terminal with its own
# update schedule is a network call and a file in $HOME that nothing here asked
# for.
update_check_interval 0
