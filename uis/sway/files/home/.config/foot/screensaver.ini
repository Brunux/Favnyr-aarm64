# The idle screen's terminal: black, no padding, large text.
#
# Same idea as Deboma's default/foot/screensaver.ini (black on black, 18 pt),
# only larger: the LazyOS art in ~/.config/lazyos/screensaver.txt is 50 columns
# wide and 9 rows tall, so 26 pt fills the 1920x1200 panel without touching the
# edges.  The foreground is solarized orange (#cb4b16) because that is the
# colour the idle screen is drawn in: tte's own effects bring their own palette,
# and the ones that paint in the terminal's foreground - and the static frame
# `lazyos-screensaver` prints when tte is missing - are then the brand colour
# instead of white.
#
# Syntax check: foot --check-config -c <this file>.
[main]
font=JetBrains Mono:size=26
pad=0x0
dpi-aware=no

[scrollback]
lines=0

[colors-dark]
background=000000
foreground=cb4b16

[csd]
preferred=server
