# The idle screensaver's terminal: black, no padding, large text.
#
# Same idea as Deboma's default/foot/screensaver.ini (black on black, 18 pt),
# only larger: the logo art in ~/.config/nureb/screensaver.txt is 58 columns
# wide and 7 rows tall, so 26 pt fills the 1920x1200 panel without touching the
# edges. The art is drawn in cyan by sway-screensaver itself.
#
# Syntax check: foot --check-config -c <this file>.
[main]
font=JetBrains Mono:size=26
pad=0x0
dpi-aware=no

[scrollback]
lines=0

[colors-dark]
background=000000
foreground=ffffff

[csd]
preferred=server
