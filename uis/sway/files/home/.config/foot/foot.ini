# foot: the session terminal, in the solarized palette.
#
# foot is the default terminal here instead of Deboma's (and this port's
# original) alacritty for two reasons: it is around half the resident memory of
# an alacritty window (it has no GPU renderer to feed - it draws with pixman),
# and it is a native Wayland client with no glib and no Rust runtime, which
# matters on a 4 GB machine whose whole point is that the compositor and the bar
# fit around the applications.  The bar's popups (nmtui, bluetoothctl, the apt
# updater) run here too, with `--app-id=popup`.
#
# Syntax check: foot --check-config -c <this file>.
#
# The palette is solarized dark, the same one as style.css and rofi.
[main]
# Symbols Nerd Font Mono is the fallback, and it is what makes the icons render:
# eza --icons (the `ls` alias), fastfetch and the starship git glyphs all ask for
# Nerd Font codepoints that JetBrains Mono does not have. foot does not use
# fontconfig fallback for missing glyphs - a font it is not given is a box - so
# the fallback has to be listed here. (waybar gets away without it because it is
# a GTK/Pango program; a terminal is not.)
font=JetBrains Mono:size=11, Symbols Nerd Font Mono:size=11
pad=6x6
dpi-aware=no

[scrollback]
lines=1000

[colors-dark]
foreground=93a1a1
background=002b36
regular0=073642
regular1=dc322f
regular2=859900
regular3=b58900
regular4=268bd2
regular5=d33682
regular6=2aa198
regular7=eee8d5
bright0=586e75
bright1=cb4b16
bright2=586e75
bright3=657b83
bright4=839496
bright5=93a1a1
bright6=657b83
bright7=fdf6e3

[csd]
preferred=server
