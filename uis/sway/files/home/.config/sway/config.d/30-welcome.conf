# The first boot's welcome window (see ~/.config/bin/lazyos-welcome).  It is a
# card, not a terminal to work in, so it floats centred instead of taking the
# first tile of the workspace; 760x560 fits the 1920x1200 panel and the page
# inside it.  The script shows it once per install and remembers the machine id
# in ~/.local/state/lazyos/welcome.
for_window [app_id="lazyos-welcome"] floating enable
for_window [app_id="lazyos-welcome"] resize set 760 560
for_window [app_id="lazyos-welcome"] move position center

exec /home/brunux/.config/bin/lazyos-welcome
