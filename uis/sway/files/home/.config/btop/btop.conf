# btop reads this file on start and writes its own defaults back into it, so it
# is kept to the one line that belongs to the session: the theme file.
#
# The theme itself is generated (~/.config/btop/themes/lazyos.theme, written by
# `lazyos theme set`), which is why this file names it and nothing else. btop
# merges the rest with its built-in defaults.
color_theme = "lazyos"
