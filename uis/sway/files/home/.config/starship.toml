# starship: the prompt, ported from Deboma (omarchy's config/starship.toml).
#
# Directory and git state only, in the theme's cyan: the bar already reports
# battery, network and volume, so a prompt that repeated them would be noise on
# a 1200 px wide terminal. `$character` is cyan on success and red on error,
# which is the one piece of state a prompt has to show.
#
# Read by `starship init bash` in ~/.bashrc; the binary comes from
# packages/tools.list. The git_status glyphs (U+F00C, U+EA71, U+EBAB) are Nerd
# Font codicons, so ~/.config/foot/foot.ini lists Symbols Nerd Font Mono as a
# fallback; without it they would be boxes, not icons.

add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
