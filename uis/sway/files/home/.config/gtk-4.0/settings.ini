[Settings]
# GTK4 settings for the whole session (/home/*/.config/gtk-4.0/settings.ini).
#
# The GTK3 file next door is not read by a GTK4 application, and the two
# toolkits do not share a settings store. `papers` - the document reader, and
# the one GTK4 window this image ships - therefore opened in libadwaita's light
# default, a white rectangle in a session whose every other pixel is base03.
#
# libadwaita asks the settings portal for the desktop's colour scheme, and this
# image has no Settings portal: `busctl --user` lists only
# org.freedesktop.impl.portal.desktop.wlr, which implements Screenshot and
# ScreenCast. GTK4 reads this file, and libadwaita falls back to
# gtk-application-prefer-dark-theme when the portal answers nothing, so the
# preference is stated here instead of installing a portal backend whose only
# job would be one boolean.
#
# gtk.css next to this file then repaints the libadwaita named colours in the
# solarized palette; the preference alone only gets Adwaita's own dark set.
gtk-application-prefer-dark-theme=1
# Same icon alphabet as the GTK3 file: the LazyOS theme, which inherits Adwaita
# and hicolor, so an application that brings its own icons still shows them.
# (libadwaita applications draw their own symbolic icons anyway; this is what
# the file chooser and a non-libadwaita GTK4 window ask for.)
gtk-icon-theme-name=LazyOS
# One typography for the session: the bar, the launcher, the terminal, the file
# manager and the document reader are all JetBrains Mono.
gtk-font-name=JetBrains Mono 10
# swayfx already animates the window (animation_duration_ms 150); a second
# animation inside it is frames this device notices.
gtk-enable-animations=0
